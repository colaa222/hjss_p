<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카카오톡 자동 발송</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
    }

    .box {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    pre {
      background: #f7f7f7;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>카카오톡 자동 발송</h1>

  <div class="box">
    <h2>1건 발송</h2>
    <input id="target" type="text" placeholder="채팅방 이름" />
    <textarea id="message" rows="5" placeholder="보낼 메시지"></textarea>
    <button onclick="sendOne()">1건 발송</button>
  </div>

  <div class="box">
    <h2>엑셀 전체 발송</h2>
    <button onclick="sendExcel()">엑셀 전체 발송</button>
  </div>

  <div class="box">
    <h2>결과</h2>
    <pre id="result"></pre>
  </div>

  <script>
    async function sendOne() {
      const target = document.getElementById("target").value;
      const message = document.getElementById("message").value;

      const res = await fetch("/api/send", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          target,
          message
        })
      });

      const data = await res.json();
      document.getElementById("result").textContent =
        JSON.stringify(data, null, 2);
    }

    async function sendExcel() {
      const res = await fetch("/api/send-excel", {
        method: "POST"
      });

      const data = await res.json();

      document.getElementById("result").textContent =
        JSON.stringify(data, null, 2);

      alert(
        `총 ${data.total}건\n성공 ${data.success}건\n실패 ${data.fail}건`
      );
    }
  </script>
</body>
</html>
